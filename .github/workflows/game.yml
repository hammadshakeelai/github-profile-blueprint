name: Interactive State Machine & Gaming Engine

on:
  issues:
    types: [opened]

concurrency:
  group: issue-game-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process-interaction:
    if: startsWith(github.event.issue.title, 'ttt|') || startsWith(github.event.issue.title, 'mud|')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process Tic-Tac-Toe Move
        if: startsWith(github.event.issue.title, 'ttt|')
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/tictactoe.py

      - name: Process Cyber MUD Adventure Move
        if: startsWith(github.event.issue.title, 'mud|')
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/cyber_mud.py

      - name: Commit Updated Game & World State
        env:
          ACTOR_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          git commit -m "game: state mutated by @${ACTOR_LOGIN} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main

      - name: Comment and Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --body "Action processed! Your turn has been rendered to the profile README."
          gh issue close $ISSUE_NUMBER --reason "completed"
