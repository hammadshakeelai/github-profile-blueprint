name: ProfileHarness Autonomous Engine

on:
  schedule:
    # Run every 6 hours at off-peak minute 23 (05:23, 11:23, 17:23, 23:23 UTC)
    - cron: '23 */6 * * *'
  workflow_dispatch: # Enable manual trigger from GitHub web UI
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - '.github/workflows/profile-harness.yml'

concurrency:
  group: profile-harness
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Profile via ProfileHarness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python harness/engine.py build

      - name: Idempotent Bot Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/

          if git diff --staged --quiet; then
            echo "Zero changes detected. Commit graph preserved."
            exit 0
          fi

          git commit -m "chore(profile): synchronize telemetry and autonomous SVGs [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Rollback Dirty Workspace on Failure
        if: failure()
        run: |
          git checkout -- .
          git clean -fd
