<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="650" height="160">
  <defs>
    <style>
      .term-window { fill: #0b0f19; stroke: #1e293b; stroke-width: 1.5; rx: 8px; }
      .term-header { fill: #111827; }
      .term-prompt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #10b981; font-weight: 600; }
      .term-cmd { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #e2e8f0; }
      .term-out { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; fill: #94a3b8; }
      .cursor {
        fill: #38bdf8;
        animation: blink 0.8s infinite step-start;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .anim-type {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        animation: typing 8s steps(40, end) infinite;
      }
      @keyframes typing {
        0% { max-width: 0; }
        35%, 85% { max-width: 450px; }
        95%, 100% { max-width: 0; }
      }
    </style>
  </defs>

  <rect class="term-window" x="2" y="2" width="646" height="156"/>
  <rect class="term-header" x="2" y="2" width="646" height="28" rx="8"/>

  <!-- Window controls -->
  <circle cx="20" cy="16" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="16" r="4.5" fill="#eab308"/>
  <circle cx="52" cy="16" r="4.5" fill="#22c55e"/>
  <text x="325" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">guest@node-01:~ (x86_64-zen)</text>

  <!-- Shell lines -->
  <g transform="translate(20, 56)">
    <text class="term-prompt" x="0" y="0">arch-node:~$</text>
    <text class="term-cmd" x="110" y="0">cargo test --package consensus-raft -- --nocapture</text>
  </g>

  <g transform="translate(20, 84)">
    <text class="term-out" x="0" y="0">  [OK] 24 verification invariants verified via TLA+ &amp; miri</text>
    <text class="term-out" x="0" y="18">  [OK] Zero lock contention across 128 hardware threads</text>
  </g>

  <g transform="translate(20, 130)">
    <text class="term-prompt" x="0" y="0">arch-node:~$</text>
    <text class="term-cmd" x="110" y="0">deploy-cluster --env=prod</text>
    <rect class="cursor" x="305" y="-11" width="7" height="14"/>
  </g>
</svg>
