<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 309 194" width="309" height="194" role="img" aria-label="Text at 20, 15, 13, 11, 9 and 7 units to find the real legibility floor on a phone">
  <rect width="309" height="194" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="16" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e6edf3">20 units — readable?</text><text x="16" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#e6edf3">15 units — readable?</text><text x="16" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e6edf3">13 units — readable?</text><text x="16" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#e6edf3">11 units — readable?</text><text x="16" y="142" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8b949e">9 units — too small</text><text x="16" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7" fill="#8b949e">7 units — too small</text>
</svg>
