<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-label="A square that slides, unless the viewer asks for reduced motion">
  <style>
    .bg { fill: #0d1117 } .fg { fill: #e6edf3 } .dot { fill: #58a6ff }
    .dot { animation: slide 2s ease-in-out infinite alternate }
    @keyframes slide { to { transform: translateX(420px) } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
  </style>
  <rect class="bg" width="600" height="120" rx="12"/>
  <text class="fg" x="24" y="40" font-family="ui-monospace, monospace" font-size="22">CSS keyframes, guarded</text>
  <rect class="dot" x="24" y="60" width="120" height="40" rx="8"/>
</svg>
