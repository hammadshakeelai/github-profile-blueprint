<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-label="A sliding square, the moving variant">
  <rect width="600" height="120" rx="12" fill="#0d1117"/>
  <text x="24" y="40" font-family="ui-monospace, monospace" font-size="22" fill="#e6edf3">MOTION variant</text>
  <rect x="24" y="60" width="120" height="40" rx="8" fill="#58a6ff">
    <animate attributeName="x" values="24;444;24" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
