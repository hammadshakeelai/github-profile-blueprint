<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="A gauge filling to 72 percent">
  <rect width="600" height="220" rx="16" fill="#0d1117"/>
  <g transform="translate(130 128)">
    <path d="M-80 0 A 80 80 0 0 1 80 0" pathLength="100" fill="none" stroke="#21262d" stroke-width="18" stroke-linecap="round"/>
    <path d="M-80 0 A 80 80 0 0 1 80 0" pathLength="100" fill="none" stroke="#e3b341" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="72 100">
      <animate attributeName="stroke-dasharray" values="0 100;72 100;72 100;0 100" keyTimes="0;0.3;0.9;1"
               dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.2 1;0 0 1 1;0.4 0 1 1"/>
    </path>
    <text y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f0f6fc">72%</text>
  </g>
  <text x="270" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f0f6fc">Gauge</text>
  <text x="270" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#8b949e">pathLength="100"</text>
  <text x="270" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#8b949e">dasharray = value</text>
</svg>
