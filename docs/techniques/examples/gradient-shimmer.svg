<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="Text with a moving shimmer">
  <!-- Animates the gradient's x1/x2 in user space. WebKit (Safari) does not
       animate gradientTransform in SVG images; x1/x2 and stop offsets work in
       Chromium, Firefox and WebKit alike. -->
  <defs>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8b949e"/><stop offset="0.45" stop-color="#8b949e"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#8b949e"/><stop offset="1" stop-color="#8b949e"/>
      <animate attributeName="x1" values="-300;300" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;600" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="600" height="220" rx="16" fill="#0d1117"/>
  <text x="40" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#shine)">Shimmer</text>
  <text x="40" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#8b949e">animated x1/x2 — every engine</text>
</svg>
