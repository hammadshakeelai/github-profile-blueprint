<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="Gradient card with film grain">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feComposite in="faint" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="card"><rect width="600" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="220" fill="url(#g)"/>
    <rect width="600" height="220" fill="#fff" filter="url(#grain)"/>
  </g>
  <text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Film grain</text>
  <text x="40" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#e6edf3">feTurbulence, no image file</text>
</svg>
