<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="An underline drawn with SMIL">
  <rect width="600" height="220" rx="16" fill="#0d1117"/>
  <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f0f6fc">Drawn with SMIL</text>
  <path d="M40 132 L 400 132" pathLength="1" stroke="#f78166" stroke-width="7" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.4;0.85;1" dur="3s" repeatCount="indefinite"/>
  </path>
  <text x="40" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#8b949e">&lt;animate&gt; on stroke-dashoffset</text>
</svg>
