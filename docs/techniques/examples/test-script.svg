<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" role="img" aria-label="Boundary test: does a script inside the SVG run?">
  <rect id="panel" width="600" height="160" rx="16" fill="#1a7f37"/>
  <text id="label" x="40" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">GREEN = scripts blocked</text>
  <script>
    document.getElementById('panel').setAttribute('fill', '#cf222e');
    document.getElementById('label').textContent = 'RED = script ran';
  </script>
</svg>
