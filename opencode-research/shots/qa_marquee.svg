<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <clipPath id="band">
      <rect x="32" y="120" width="736" height="64" rx="10"/>
    </clipPath>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#010409" stop-opacity="1"/>
      <stop offset="1" stop-color="#010409" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#010409" stop-opacity="0"/>
      <stop offset="1" stop-color="#010409" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" fill="#0d1117"/>
  <rect width="800" height="320" fill="url(#grid)"/>

  <text x="32" y="46" font-size="16" font-weight="700" letter-spacing="3" fill="#58a6ff">SEAMLESS MARQUEE</text>
  <text x="32" y="70" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7d8590">two text copies · one clipPath · textLength locks the seam · 0 javascript</text>

  <rect x="32" y="120" width="736" height="64" rx="10" fill="#010409" stroke="#30363d"/>
  <g clip-path="url(#band)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e6edf3">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -1104 0" dur="12s" repeatCount="indefinite" calcMode="linear"/>
        <text x="0" y="159" textLength="1104" lengthAdjust="spacingAndGlyphs">446 profiles measured · 41% broken images · 55% text under 11px · 42% badge soup · 54% use Actions · 20% theme switch · </text>
        <text x="1104" y="159" textLength="1104" lengthAdjust="spacingAndGlyphs">446 profiles measured · 41% broken images · 55% text under 11px · 42% badge soup · 54% use Actions · 20% theme switch · </text>
      </g>
    </g>
    <rect x="32" y="120" width="56" height="64" fill="url(#fadeL)"/>
    <rect x="712" y="120" width="56" height="64" fill="url(#fadeR)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7d8590">
    <text x="32" y="216">copy A x=0..1104 · copy B x=1104..2208 · translate exactly -1104 = one copy = seamless</text>
    <text x="32" y="240" fill="#7ee787">first char at t=0 == first char at t=12s · no jump, no gap, no js</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <rect x="32" y="272" width="94" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="79" y="288" text-anchor="middle" fill="#7ee787">clip band</text>
    <rect x="134" y="272" width="104" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="186" y="288" text-anchor="middle" fill="#58a6ff">textLength</text>
    <rect x="246" y="272" width="94" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="293" y="288" text-anchor="middle" fill="#d2a8ff">linear 12s</text>
    <rect x="348" y="272" width="94" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="395" y="288" text-anchor="middle" fill="#ffa657">edge fade</text>
    <rect x="450" y="272" width="110" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="505" y="288" text-anchor="middle" fill="#ff7b72">dual copy</text>
  </g>
<script type="text/javascript"><![CDATA[
(function(){
  var T = 6000;
  function seek(){
    try { var s = document.documentElement; s.pauseAnimations(); s.setCurrentTime(T/1000); } catch(e){}
    try { document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = T; }); } catch(e){}
  }
  seek();
  if (window.requestAnimationFrame) requestAnimationFrame(function(){ requestAnimationFrame(seek); });
})();
]]></script>
</svg>
